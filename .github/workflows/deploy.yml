name: Deploy to local server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rebuild and restart containers
        run: docker compose -f docker/docker-compose.yml --env-file .env up -d --build
